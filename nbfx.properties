# nbfx build configuration.
#
# This repository hosts the pure-JavaFX nbfx clusters and consumes apache/netbeans
# as a git submodule. Override any of these with -D<name>=<value> on the ant command line.

# --- submodule -----------------------------------------------------------------
nbfx.submodule.dir=netbeans
nbfx.submodule.url=https://github.com/apache/netbeans
# The upstream revision the nbfx sources are built against. Re-check and bump with
# `ant update-upstream -Dnbfx.submodule.commit=<sha>`.
nbfx.submodule.commit=0104eeb3da7094338212ea8a37a32a73354c7574

# --- overlay (how the nbfx cluster dirs become visible to the netbeans build) ---
# "sync"    = copy/mirror into the submodule (cross-platform, default)
# "symlink" = symlink into the submodule (Unix only, fastest dev loop)
nbfx.overlay=sync

# --- clusters ------------------------------------------------------------------
# cluster dirs, in dependency order (platform -> ide -> java)
nbfx.clusters=nbfx-platform,nbfx-ide,nbfx-java
# the cluster.config name (selects clusters.config.<name>.list from the generated file)
nbfx.cluster.config=nbfx
nbfx.fragment.file=cluster/nbfx-cluster.properties.fragment
nbfx.build.dir=build
nbfx.cluster.properties=build/cluster.properties

# --- release (see RELEASING.md) -------------------------------------------------
# the version being released; tags are <version>-<rc> (e.g. 0.1.0-rc1) and <version>
nbfx.version=0.1.0
# the release candidate, e.g. -Dnbfx.rc=rc1; empty for the final tag
nbfx.rc=
# signing key: pass -Dnbfx.gpg.key=<fingerprint> (it must be in KEYS)
# Apache Rat, pinned (the version upstream nbbuild uses)
nbfx.rat.version=0.18
nbfx.rat.sha256=fe513ddd10cdc07e965ba430f2c093d8745ff24a0fb54efe0933653752c53301

# --- provenance (informational only) ---------------------------------------------
# The repository/branch the nbfx sources were migrated from. The repository is now
# standalone; only the netbeans submodule pin needs updating over time.
nbfx.source.repo=https://github.com/gluonhq/netbeans
nbfx.source.branch=netbeansfx-sep26
nbfx.source.commit=b9c99658cd981752d49fc8a6bc5522a13a9c703d

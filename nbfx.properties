# nbfx build configuration.
#
# This repository hosts the pure-JavaFX nbfx clusters and consumes apache/netbeans
# as a git submodule. Override any of these with -D<name>=<value> on the ant command line.

# --- submodule -----------------------------------------------------------------
nbfx.submodule.dir=netbeans
nbfx.submodule.url=https://github.com/apache/netbeans
# The upstream revision the nbfx sources are built against. Re-check and bump with
# `ant update-upstream -Dnbfx.submodule.commit=<sha>`.
nbfx.submodule.commit=0104eeb3da7094338212ea8a37a32a73354c7574

# --- overlay (how the nbfx cluster dirs become visible to the netbeans build) ---
# "sync"    = copy/mirror into the submodule (cross-platform, default)
# "symlink" = symlink into the submodule (Unix only, fastest dev loop)
nbfx.overlay=sync

# --- clusters ------------------------------------------------------------------
# cluster dirs, in dependency order (platform -> ide -> java)
nbfx.clusters=nbfx-libs,nbfx-api,nbfx-platform,nbfx-ide,nbfx-java
# the cluster.config name (selects clusters.config.<name>.list from the generated file)
nbfx.cluster.config=nbfx
nbfx.fragment.file=cluster/nbfx-cluster.properties.fragment
nbfx.build.dir=build
nbfx.cluster.properties=build/cluster.properties

# Upstream modules dropped from the cluster lists (module directory names as they appear in
# nbbuild/cluster.properties). `ant cluster-config` strips them from the generated file and
# `ant bootstrap` prunes their previously built jars, so they are neither built, nor loaded by
# `ant run`, nor zipped by `ant release-bin`. Keep this closed under dependents: a module left in
# that depends on one listed here breaks the build, and a non-autoload module that cannot be
# enabled at runtime brings up the "could not install some modules" dialog on the first start.
nbfx.cluster.exclude=\
    core.windows,\
    progress.ui,\
    core.kit,core.multitabs,core.multitabs.project,ide.kit,db.kit,\
    notifications,texttools,java.navigation,beans,\
    spring.beans,gradle.spring,maven.spring,maven.search,\
    ant.kit,java.kit,gradle.kit,maven.kit,form.kit,\
    debugger.jpda.kit,debugger.jpda.jsui,debugger.jpda.visual,j2ee.persistence.kit,\
    apisupport.kit,timers
# core.windows       Swing window system; replaced by the nbfx FX window system
# progress.ui        Swing progress UI; replaced by c.gluonhq.netbeans.nbfx.progress
# core.kit ... db.kit, notifications, texttools, java.navigation, beans
#                    need core.windows (directly or via the WindowManager capability)
# spring.beans, gradle.spring, maven.spring, maven.search
#                    need beans / maven.kit; the last three are eager modules that would stay off
# *.kit              empty feature umbrellas for the Swing plugin manager, chained to ide.kit
# apisupport.kit     needs apisupport.harness (harness cluster, not built)
# timers             needs o.n.insane (harness cluster, not built)

# --- distribution ----------------------------------------------------------------
# Name of the user/cache dir `bin/netbeans` of the binary release uses, under the platform's
# default roots (e.g. ~/Library/Application Support/NetBeans/<name> on macOS). Kept apart from
# upstream's "dev" so nbfx never shares state with an Apache NetBeans dev build (its persisted
# module status would keep the nbfx modules disabled).
nbfx.dist.userdir=nbfx-${nbfx.version}

# --- release (see RELEASING.md) -------------------------------------------------
# the version being released; tags are <version>-<rc> (e.g. 0.1.0-rc1) and <version>
nbfx.version=0.1.0
# the release candidate, e.g. -Dnbfx.rc=rc1; empty for the final tag
nbfx.rc=
# signing key: pass -Dnbfx.gpg.key=<fingerprint> (it must be in KEYS)
# Apache Rat, pinned (the version upstream nbbuild uses)
nbfx.rat.version=0.18
nbfx.rat.sha256=fe513ddd10cdc07e965ba430f2c093d8745ff24a0fb54efe0933653752c53301

# --- provenance (informational only) ---------------------------------------------
# The repository/branch the nbfx sources were migrated from. The repository is now
# standalone; only the netbeans submodule pin needs updating over time.
nbfx.source.repo=https://github.com/gluonhq/netbeans
nbfx.source.branch=netbeansfx-sep26
nbfx.source.commit=b9c99658cd981752d49fc8a6bc5522a13a9c703d

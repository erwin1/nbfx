# Saves ~/.hgexternalcache as ci.yml does, under a key with the fingerprint of its content: a run
# that downloaded more saves a fuller cache instead of being blocked by an immutable partial key.
# Use it at the end of a job, with if: always(): DownloadBinaries and javafx-fetch only leave
# complete, verified files, so the cache is a valid seed even after a failed build.
name: Save the nbfx build cache
description: Save the external-binaries cache under a content-addressed key

runs:
  using: composite
  steps:
    - name: Fingerprint external binary cache
      id: external-cache-key
      shell: bash
      run: |
        cache="${HOME}/.hgexternalcache"
        if [ -d "${cache}" ] && [ -n "$(find "${cache}" -type f -print -quit)" ]; then
          fingerprint=$(cd "${cache}" && find . -type f -printf '%P %s\n' | sort | sha256sum | cut -d' ' -f1)
          echo "key=${{ runner.os }}-${{ hashFiles('netbeans/**/external/binaries-list') }}-${fingerprint}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Save external binary cache
      if: steps.external-cache-key.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ~/.hgexternalcache
        key: ${{ steps.external-cache-key.outputs.key }}

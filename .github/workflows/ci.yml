name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with the NetBeans submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'

      - name: Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
          ant -version

      - name: Bootstrap and build the nbfx clusters
        run: |
          ant bootstrap
          ant build

      - name: Guards
        run: |
          ant check-purity
          ant -f check-purity.xml check-figures

      - name: Scenario test (headless glass)
        run: |
          cd netbeans/nbbuild
          ant -f ../nbfx-ide/c.gluonhq.netbeans.nbfx.launcher/build.xml test

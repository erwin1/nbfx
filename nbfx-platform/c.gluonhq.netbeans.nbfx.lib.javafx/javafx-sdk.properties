# The OpenJFX SDK this module bundles, one zip per supported platform. Nothing of it is in git:
# `ant bootstrap` (javafx-fetch in ../../build.xml) downloads the SDK of the build platform, checks
# its SHA-256 and unpacks the jars, natives and licence texts into release/ (git-ignored).
#
# To move to another JavaFX version: change nbfx.javafx.version and every SHA-256 below (Gluon
# publishes them next to each zip, <url>.sha256), then `ant clean bootstrap build run`.

nbfx.javafx.version=27
nbfx.javafx.url=https://download2.gluonhq.com/openjfx/${nbfx.javafx.version}

# nbfx platform id -> the SDK's platform id and the SHA-256 of
# ${nbfx.javafx.url}/openjfx-${nbfx.javafx.version}_<sdk id>_bin-sdk.zip
nbfx.javafx.sdk.macos-aarch64=osx-aarch64
nbfx.javafx.sha256.macos-aarch64=2de02c56c406ec91b1877e9e8e546efcc08ff7c2f5d979e51d54c991085e3fe5
nbfx.javafx.sdk.macos-x64=osx-x64
nbfx.javafx.sha256.macos-x64=4a1acb7e3b662a6c682f81d57bbf45e89d25464ad3f1d1371ec6317222cd40a6
nbfx.javafx.sdk.windows-x64=windows-x64
nbfx.javafx.sha256.windows-x64=e45b9d2bf44aad1d7867c045181bfaef940ce569c7d7b0c05ee96a1d7089dcc1
nbfx.javafx.sdk.linux-x64=linux-x64
nbfx.javafx.sha256.linux-x64=36857953977bf43f4b2c287f9431de884536431b502ac0edc0c6fcca0274e234

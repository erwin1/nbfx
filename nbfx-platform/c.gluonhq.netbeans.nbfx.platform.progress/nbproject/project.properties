javac.source=25
javac.target=25
javac.release=25
javac.compilerargs=-Xlint -Xlint:-serial
javadoc.name=nbfx-progress
javadoc.title=NetBeansFX nbfx-progress
# Run the unit tests on the JDK's headless JavaFX glass platform (JavaFX 26+, com.sun.glass.ui.headless),
# so the worker's events can be applied on the JavaFX Application Thread without a display. The Quantum
# toolkit still selects a Prism pipeline, so pin the software one and give the fork the native libraries:
# the version-tracked ones in nbfx.libs.javafx's release/ tree (present in any checkout, both standalone
# and clustered).
test-unit-sys-prop.glass.platform=Headless
test-unit-sys-prop.prism.order=sw
test-unit-sys-prop.java.library.path=${basedir}/../../nbfx-libs/c.gluonhq.netbeans.nbfx.libs.javafx/release/modules/lib${path.separator}${netbeans.dest.dir}/modules/lib
